[www]
user = www-data
group = www-data

; Listen on TCP socket (required for Nginx FastCGI pass in same container)
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process manager
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Logging
; NOTE: /proc/self/fd/2 causes exit status 78 (EX_CONFIG) on Alpine PHP-FPM.
; Use a real file path instead.
access.log = /tmp/php-fpm-access.log
php_admin_value[error_log] = /tmp/php-fpm-worker.log
php_admin_flag[log_errors] = on
catch_workers_output = yes
decorate_workers_output = no

; Security
; open_basedir removed: it blocks composer/artisan from accessing system paths
; and causes package:discover to fail. Restrict at the infrastructure level instead.
php_admin_value[upload_tmp_dir] = /tmp/php-tmp
php_admin_value[session.save_path] = /var/lib/php/sessions
php_admin_value[sys_temp_dir] = /tmp/php-tmp

; Production safety: suppress E_NOTICE (includes "tempnam(): file created in
; system's temporary directory" notice) when APP_ENV=production or APP_DEBUG=false
; Laravel HandleExceptions converts E_NOTICE to ErrorException so this prevents
; 500 errors when fallback temp dir is used.
php_admin_value[error_reporting] = E_ALL & ~E_NOTICE & ~E_WARNING & ~E_DEPRECATED & ~E_STRICT
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[html_errors] = off

; Performance
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 20M

; OPcache
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 4000
php_admin_value[opcache.revalidate_freq] = 60
php_admin_value[opcache.fast_shutdown] = 1
