name: Deploy Admin to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'Admin/**'
  workflow_dispatch:

jobs:
  deploy-admin:
    name: 🚀 Deploy Admin Project
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 🛑 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: 🔨 Install Composer (Admin)
      working-directory: ./Admin
      run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

    - name: 📦 Upload Admin to Hostinger via SSH rsync
      uses: AEnterprise/rsync-deploy@v1.1.0
      env:
        DEPLOY_KEY: ${{ secrets.SSH_PASSWORD }}
        ARGS: "-avz --delete"
        SERVER: ${{ secrets.SSH_HOST }}
        USER: ${{ secrets.SSH_USERNAME }}
        PORT: ${{ secrets.SSH_PORT }}
        FOLDER: "./Admin/"
        SERVER_DEST: "/home/u793353577/domains/blueviolet-lion-228360.hostingersite.com/public_html/Admin/"